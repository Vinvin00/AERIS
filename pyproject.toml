[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris"
version = "0.0.1"
description = "Monocular aircraft perception research — engineering scaffold"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "opencv-python-headless>=5,<6"]

[project.scripts]
aeris = "aeris.cli:main"
aeris-ui = "aeris.ui.app:main"
aeris-web = "aeris.web.server:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
evaluation = ["pycocotools==2.0.11", "trackeval==1.3.0", "scipy==1.17.1", "tabulate==0.9.0"]
detection = ["onnxruntime==1.30.0"]
tracking = ["scipy==1.17.1"]
desktop = ["PySide6-Essentials==6.12.0"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"aeris.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
