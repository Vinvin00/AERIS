[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris"
version = "0.0.1"
description = "Monocular aircraft perception research — engineering scaffold"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "opencv-python-headless>=5,<6"]

[project.optional-dependencies]
# Standard evaluators (AERIS-005, ADR 005). TrackEval is pinned to the official upstream
# commit; pycocotools is the maintained PyPI build of the COCO API.
eval = [
    "pycocotools==2.0.11",
    "scipy>=1.11,<2",
    "trackeval @ git+https://github.com/JonathonLuiten/TrackEval@12c8791b303e0a0b50f753af204249e622d0281a",
]
# ONNX Runtime CPU path of the pretrained detector baseline (AERIS-006,
# configs/detector/baseline.json). The PyTorch reference path is not packaged yet.
detector = ["onnxruntime==1.30.0", "onnx==1.23.0"]
dev = [
    "pytest>=8,<9", "ruff>=0.11,<1",
    "pycocotools==2.0.11",
    "scipy>=1.11,<2",
    "trackeval @ git+https://github.com/JonathonLuiten/TrackEval@12c8791b303e0a0b50f753af204249e622d0281a",
    "onnxruntime==1.30.0", "onnx==1.23.0",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
